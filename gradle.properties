org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Workaround: rutas de red (Z:) rompen compilacion incremental al EDITAR en Z:
# En C:\DynamicFrame (compilacion) el daemon y cache si aceleran rebuilds
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# No usar version catalog (libs.versions.toml): genera clases con '$' que fallan en Z:
